# Set NFC Pins on Xiao as GPIO
CONFIG_NFCT_PINS_AS_GPIOS=y

# Disable OLED Display
CONFIG_ZMK_DISPLAY=y

# Enable USB and BLE
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Boost Bluetooth TX power to +8dBm for rock-solid connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Matrix polling (CRITICAL: prevents matrix freeze from NFC pin on col0)
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# USB logging (Disabled for battery savings; enable only for debugging)
CONFIG_ZMK_USB_LOGGING=n

# CDC ACM 1200 baud touch & UART trigger support
CONFIG_CDC_ACM_DTE_RATE_CALLBACK_SUPPORT=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_REBOOT=y

# Settings & Flash persistence (NVS)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Save settings quickly to flash (10 seconds)
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# ZMK Studio (Enabled & Unlocked)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# Enable Pointing (Mouse Keys)
CONFIG_ZMK_POINTING=y

# Prospector Scanner Status Advertisement
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Chippy"
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="LEFT"
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=1000
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=5000
CONFIG_ZMK_STATUS_ADV_WPM_WINDOW_SECONDS=30

# Deep sleep is disabled (CONFIG_ZMK_SLEEP=n) due to verified wake-up failure bug
CONFIG_ZMK_SLEEP=n


# OLED Display & Blanking (Power Saving)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=3000
CONFIG_SSD1306_DEFAULT_CONTRAST=16
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n

