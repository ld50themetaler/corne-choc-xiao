name: Build ZMK Firmware

on:
  push:
    paths:
      - 'config/**'
      - 'build.yaml'
      - '.github/workflows/**'
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'config/**'
      - 'build.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
