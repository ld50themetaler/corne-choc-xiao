# Disable OLED Display
CONFIG_ZMK_DISPLAY=n

# Enable USB and BLE
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Boost Bluetooth TX power to +8dBm for rock-solid connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Matrix polling (CRITICAL: prevents matrix freeze from NFC pin on col0)
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# CDC ACM 1200 baud touch & UART trigger support
CONFIG_CDC_ACM_DTE_RATE_CALLBACK_SUPPORT=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_REBOOT=y

# Settings & Flash persistence (NVS)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Save settings quickly to flash (10 seconds instead of default 60 seconds)
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
